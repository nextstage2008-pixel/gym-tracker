<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ジム記録">
<meta name="theme-color" content="#0c0c0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ジム記録 - Gym Tracker</title>
<style>
:root{
  /* GOLD'S GYM ブランド: イエロー #FFEC00 × ブラック */
  --bg:#0c0c0d; --card:#17171a; --card2:#212124; --line:#2e2e32;
  --text:#f2f2f0; --sub:#9c9c96; --gold:#FFEC00; --gold-dim:#8f8500;
  --green:#4cc38a; --red:#e5534b; --blue:#ff4438;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:16px; overscroll-behavior-y:none;}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom));}
header{position:sticky; top:0; z-index:10; background:rgba(10,10,11,.95); backdrop-filter:blur(8px);
  padding:calc(8px + env(safe-area-inset-top)) 16px 8px; border-bottom:2px solid var(--gold);
  display:flex; align-items:center; justify-content:space-between;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-logo{width:44px; height:44px; flex:none; border-radius:50%;}
.brand-name{font-size:17px; font-weight:900; font-style:italic; letter-spacing:.03em; color:var(--gold);
  font-family:"Avenir Next Condensed","Arial Narrow","Arial Black",-apple-system,sans-serif; line-height:1.1;}
.brand-sub{font-size:8px; letter-spacing:.34em; color:var(--sub); font-weight:600; margin-top:1px;}
header .date{font-size:13px; color:var(--sub);}
main{padding:14px 14px 20px; max-width:560px; margin:0 auto;}
.tab-page{display:none;}
.tab-page.active{display:block;}
nav{position:fixed; bottom:0; left:0; right:0; z-index:10; display:flex;
  background:rgba(26,26,32,.97); backdrop-filter:blur(8px); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);}
nav button{flex:1; background:none; border:none; color:var(--sub); font-size:11px; padding:8px 0 6px; cursor:pointer;}
nav button .ico{display:block; font-size:20px; margin-bottom:2px;}
nav button.active{color:var(--gold);}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
.card h3{font-size:15px; margin-bottom:8px; display:flex; align-items:center;}
.card h3::before{content:""; display:inline-block; width:4px; height:13px; background:var(--gold);
  margin-right:8px; transform:skewX(-14deg); flex:none;}
.muted{color:var(--sub); font-size:13px;}
.small{font-size:12px;}
.badge{display:inline-block; background:var(--gold); color:#111; font-weight:700; border-radius:8px; padding:2px 10px; font-size:14px;}
.badge.b{background:var(--blue); color:#fff;}
.row{display:flex; align-items:center; gap:8px;}
.spread{justify-content:space-between;}
button.primary{width:100%; background:var(--gold); color:#0c0c0d; border:none; border-radius:12px;
  padding:14px; font-size:16px; font-weight:900; cursor:pointer; letter-spacing:.05em;
  box-shadow:0 3px 0 var(--gold-dim);}
button.primary:active{opacity:.8;}
button.ghost{background:var(--card2); color:var(--text); border:1px solid var(--line); border-radius:10px;
  padding:8px 14px; font-size:14px; cursor:pointer;}
button.danger{background:none; border:1px solid var(--red); color:var(--red); border-radius:10px; padding:8px 14px; font-size:14px; cursor:pointer;}
input,select{background:var(--card2); border:1px solid var(--line); color:var(--text);
  border-radius:10px; padding:10px; font-size:16px; width:100%;}
input:focus,select:focus{outline:none; border-color:var(--gold-dim);}
.ex-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px;}
.ex-card.done-card{border-color:var(--gold-dim);}
.ex-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.ex-name{font-weight:700; font-size:16px;}
.ex-target{color:var(--sub); font-size:12px; margin-top:2px;}
.suggest{margin:8px 0 4px; font-size:13px;}
.suggest .kg{color:var(--gold); font-weight:700; font-size:15px;}
.suggest .up{color:var(--green); font-weight:700;}
.kg-input-row{display:grid; grid-template-columns:88px 26px 1fr; gap:8px; align-items:center; margin-top:8px;}
.kg-input-row input[type="text"]{padding:10px 6px; text-align:center; font-size:18px; font-weight:700;}
.kg-input-row .unit{color:var(--sub); font-size:13px;}
.clr-label{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--sub); justify-content:flex-end;}
.clr-label input{width:20px; height:20px; accent-color:var(--gold);}
/* カレンダー */
.cal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.cal-head .m{font-size:17px; font-weight:700;}
.cal-head button{background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:6px 16px; font-size:16px; cursor:pointer;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-dow{text-align:center; color:var(--sub); font-size:11px; padding:2px 0;}
.cal-dow.sat{color:#6f9bd1;} .cal-dow.sun{color:var(--red);}
.cal-cell{aspect-ratio:1/1.15; background:var(--card2); border:1px solid var(--line); border-radius:8px;
  display:flex; flex-direction:column; align-items:center; padding:3px 0 2px; gap:2px; cursor:pointer; position:relative;}
.cal-cell.empty{background:none; border:none; cursor:default;}
.cal-cell .d{font-size:12px; color:var(--sub);}
.cal-cell.today .d{color:var(--gold); font-weight:700;}
.cal-cell.sel{border-color:var(--gold);}
.cal-badge{font-size:10px; font-weight:700; border-radius:5px; padding:1px 6px; line-height:1.3;}
.cal-badge.A{background:var(--gold); color:#151515;}
.cal-badge.B{background:var(--blue); color:#fff;}
.cal-wdot{width:5px; height:5px; border-radius:50%; background:var(--green); position:absolute; bottom:4px;}
.note-toggle{color:var(--gold-dim); font-size:12px; background:none; border:none; padding:4px 0; cursor:pointer; text-decoration:underline;}
.form-note{color:var(--sub); font-size:12px; margin-top:4px; display:none; line-height:1.6;}
.form-note b{color:var(--text);}
.machine-desc{background:var(--card2); border-left:3px solid var(--gold); border-radius:0 8px 8px 0; padding:8px 10px; margin-bottom:8px;}
.form-note.open{display:block;}
.last-rec{font-size:12px; color:var(--sub); margin-top:6px;}
.chart-wrap{width:100%; overflow-x:auto;}
svg text{font-family:inherit;}
.stat-row{display:flex; gap:8px; margin-bottom:12px;}
.stat{flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center;}
.stat .v{font-size:20px; font-weight:700; margin-top:2px;}
.stat .l{font-size:11px; color:var(--sub);}
.stat .v.good{color:var(--green);} .stat .v.bad{color:var(--red);} .stat .v.gold{color:var(--gold);}
table.hist{width:100%; border-collapse:collapse; font-size:13px;}
table.hist td,table.hist th{padding:7px 4px; border-bottom:1px solid var(--line); text-align:left;}
table.hist th{color:var(--sub); font-weight:500; font-size:12px;}
.menu-edit-row{display:grid; grid-template-columns:1fr 60px 64px; gap:5px; margin-bottom:6px; align-items:center;}
.menu-edit-row input{padding:8px 4px; font-size:13px; text-align:center;}
.menu-edit-row input.nm{text-align:left; padding-left:8px;}
.menu-edit-head{display:grid; grid-template-columns:1fr 60px 64px; gap:5px; color:var(--sub); font-size:11px; margin-bottom:4px;}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:var(--gold); color:#151515; font-weight:700; padding:10px 22px; border-radius:24px;
  font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:99; white-space:nowrap;}
.toast.show{opacity:1;}
.seg{display:flex; background:var(--card2); border-radius:10px; padding:3px; margin-bottom:12px;}
.seg button{flex:1; background:none; border:none; color:var(--sub); padding:8px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;}
.seg button.on{background:var(--gold); color:#151515;}
.weight-input-row{display:grid; grid-template-columns:1fr 90px; gap:8px;}
h2.sec{font-size:14px; color:var(--sub); margin:16px 0 8px; font-weight:600;}
.cardio-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.cardio-grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
.field-label{font-size:12px; color:var(--sub); margin-bottom:4px; display:block;}
</style>
</head>

      {name:"ラットプルダウン", part:"背中", sets:3, rest:"75〜90秒", inc:2.5, machine:"頭の上に長い横棒（バー）がケーブルでぶら下がっているマシン。座って太ももをパッドで固定し、バーを胸に向かって引き下ろす。懸垂の代わりになる機械。", note:"胸に向かって引く。首の後ろには引かない。"},
      {name:"シーテッドレッグカール", part:"もも裏", sets:2, rest:"60秒", inc:2.5, machine:"座って脚を前に伸ばすと、ふくらはぎの上にパッドが乗る。そのパッドを膝を曲げてイスの下へ巻き込むように押し下げる。もも裏専用。レッグエクステンションと形が似ているので「Leg Curl」表記を確認。", note:"反動を使わず、戻しをゆっくり。"},
      {name:"ショルダープレス", part:"肩", sets:2, rest:"60〜75秒", inc:2.5, machine:"背もたれ付きのシートに座ると、肩〜耳の高さに左右のハンドルがある。それを頭の上に押し上げて戻す。チェストプレスと似ているがハンドル位置が高い。", note:"腰を反らせすぎない。肘は少し前。"},
      {name:"アブドミナルクランチ", part:"腹筋", sets:2, rest:"45〜60秒", inc:2.5, machine:"座って胸の前のパッド（またはハンドル）を抱え、お腹を丸めて上体を前に倒すマシン。腹筋運動を座ったままやるイメージ。", note:"首で引かず、みぞおちを丸める。"}
    ],

      {name:"リアデルトマシン", part:"肩後部・背中上部", sets:2, rest:"60秒", inc:2.5, machine:"バタフライ（ペックフライ）マシンに逆向きに座る、または専用マシン。胸をパッドに当てて座り、両腕を前から後ろへ大きく開く。肩の後ろ側に効く。", note:"肩をすくめず、肘で開く。"},

    ]
  },
  sessions: [],   // {date, menu, exercises:[{name, kg, cleared}], cardioMin, rpe}  ※回数は10回固定
  weights: []     // {date, kg}
};

let db = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && d.menus){
        // 旧データ移行: 機械の説明・フォームメモをSEEDから補完（種目名一致）
        ["A","B"].forEach(m=>(d.menus[m]||[]).forEach(ex=>{
          const seed = SEED.menus[m].find(s=>s.name===ex.name);
          if(seed){ if(!ex.machine) ex.machine = seed.machine; if(!ex.note) ex.note = seed.note; }
        }));
        return d;
      }
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }

/* ================= ユーティリティ ================= */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDate(s){ const [y,m,d]=s.split("-"); return `${Number(m)}/${Number(d)}`; }
function dayDiff(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove("show"), 1800);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ================= 提案ロジック ================= */
// 種目の直近記録（今日以外）を取得
function lastRecord(exName){
  for(let i = db.sessions.length-1; i >= 0; i--){
    const s = db.sessions[i];
    if(s.date === todayStr()) continue;
    const ex = (s.exercises||[]).find(e => e.name === exName && Number(e.kg) > 0);
    if(ex) return {date:s.date, kg:Number(ex.kg), cleared:!!ex.cleared};
  }
  return null;
}
// 次回推奨重量: 前回「全セット10回できた」→ +inc、できなかった → 同重量
function suggest(exDef){
  const rec = lastRecord(exDef.name);
  if(!rec) return {kg:null, up:false};
  return rec.cleared ? {kg: rec.kg + exDef.inc, up:true, last:rec}
                     : {kg: rec.kg, up:false, last:rec};
}
// 今日のメニュー判定: 前回セッションの逆。初回はA
function todaysMenu(){
  const t = todayStr();
  const todaySes = db.sessions.find(s=>s.date===t);
  if(todaySes) return todaySes.menu;
  const past = db.sessions.filter(s=>s.date < t);
  if(!past.length) return "A";
  return past[past.length-1].menu === "A" ? "B" : "A";
}

/* ================= SVGチャート ================= */
// series: [{pts:[{x,y}], color, width, dash, dots}], x=日数など数値
function lineChart(series, opt){
  const W = opt.w||520, H = opt.h||240, P = {l:38, r:12, t:14, b:26};
  let xs=[], ys=[];
  series.forEach(s=>s.pts.forEach(p=>{ xs.push(p.x); ys.push(p.y); }));
  if(!xs.length) return `<div class="muted" style="padding:20px 0;text-align:center">データがまだありません</div>`;
  let x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  if(x1===x0){x1=x0+1;} const yPad=(y1-y0)*0.12||1; y0-=yPad; y1+=yPad;
  const sx = x => P.l + (x-x0)/(x1-x0)*(W-P.l-P.r);
  const sy = y => H-P.b - (y-y0)/(y1-y0)*(H-P.t-P.b);
  let g = "";
  // y軸グリッド（5本）
  for(let i=0;i<=4;i++){
    const yv = y0 + (y1-y0)*i/4, yy = sy(yv);
    g += `<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="#33333e" stroke-width="1"/>`;
    g += `<text x="${P.l-5}" y="${yy+4}" fill="#9a9aa5" font-size="10" text-anchor="end">${yv.toFixed(opt.yDec??1)}</text>`;
  }
  // x軸ラベル
  (opt.xTicks||[]).forEach(t=>{
    g += `<text x="${sx(t.x)}" y="${H-8}" fill="#9a9aa5" font-size="10" text-anchor="middle">${esc(t.label)}</text>`;
  });
  series.forEach(s=>{
    if(s.pts.length===0) return;
    const d = s.pts.map((p,i)=>(i?"L":"M")+sx(p.x).toFixed(1)+","+sy(p.y).toFixed(1)).join(" ");
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}"${s.dash?` stroke-dasharray="${s.dash}"`:""} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.dots) s.pts.forEach(p=>{ g += `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="3" fill="${s.color}"/>`; });
  });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:300px">${g}</svg></div>`;
}

function switchMenu(m){ curMenu = m; renderToday(); }
function toggleNote(i){ openNotes[i]=!openNotes[i]; document.getElementById("note-"+i).classList.toggle("open"); }

function saveSession(){
  const menu = db.menus[curMenu];
  const exercises = [];
  menu.forEach((ex,i)=>{
    const kg = parseFloat(document.getElementById(`kg-${i}`).value.replace(",", "."));
    const cleared = document.getElementById(`clr-${i}`).checked;
    if(!isNaN(kg) && kg>0) exercises.push({name:ex.name, kg, cleared});
  });
  if(!exercises.length){ toast("重量が未入力です"); return; }
  const num = id => {
    const el = document.getElementById(id);
    if(!el) return null;
    const v = parseFloat(el.value.replace(",", "."));
    return isNaN(v) ? null : v;
  };
  const t = todayStr();
  const ses = { date:t, menu:curMenu, exercises,
    cardioMin: num("cardio-min"), cardioSpeed: num("cardio-speed"),
    cardioIncline: num("cardio-incline"), cardioLevel: num("cardio-level") };
  const idx = db.sessions.findIndex(s=>s.date===t && s.menu===curMenu);
  if(idx>=0) db.sessions[idx]=ses; else db.sessions.push(ses);
  db.sessions.sort((a,b)=>a.date<b.date?-1:1);
  save();
  toast("💪 保存しました！おつかれさま！");
  renderToday();
}

let calYm = null;   // {y, m} 表示中の年月（m: 0-11）
let calSel = null;  // 選択中の日付文字列

function renderCal(){
  const page = document.getElementById("page-cal");
  const t = todayStr();
  if(!calYm){ const n = new Date(); calYm = {y:n.getFullYear(), m:n.getMonth()}; }
  if(!calSel) calSel = t;
  const {y, m} = calYm;
  const dstr = d => y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  const sesByDate = {}; db.sessions.forEach(s=>{ sesByDate[s.date] = s; });
  const wByDate = {}; db.weights.forEach(w=>{ wByDate[w.date] = w; });

  // 月サマリー
  const prefix = y+"-"+String(m+1).padStart(2,"0");
  const monthSes = db.sessions.filter(s=>s.date.startsWith(prefix));
  const cntA = monthSes.filter(s=>s.menu==="A").length, cntB = monthSes.filter(s=>s.menu==="B").length;

  let html = `<div class="card">
    <div class="cal-head">
      <button onclick="calMove(-1)">‹</button>
      <span class="m">${y}年${m+1}月</span>
      <button onclick="calMove(1)">›</button>
    </div>
    <div class="cal-grid">
      ${["月","火","水","木","金"].map(d=>`<div class="cal-dow">${d}</div>`).join("")}
      <div class="cal-dow sat">土</div><div class="cal-dow sun">日</div>`;

  const first = new Date(y, m, 1);
  const lead = (first.getDay()+6)%7;            // 月曜始まり
  const days = new Date(y, m+1, 0).getDate();
  for(let i=0;i<lead;i++) html += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=days; d++){
    const ds = dstr(d);
    const ses = sesByDate[ds];
    const cls = ["cal-cell"];
    if(ds===t) cls.push("today");
    if(ds===calSel) cls.push("sel");
    html += `<div class="${cls.join(" ")}" onclick="calPick('${ds}')">
      <span class="d">${d}</span>
      ${ses?`<span class="cal-badge ${ses.menu}">${ses.menu}</span>`:""}
      ${wByDate[ds]?`<span class="cal-wdot"></span>`:""}
    </div>`;
  }
  html += `</div>
    <div class="muted small" style="margin-top:10px">今月 <b style="color:var(--gold)">${monthSes.length}回</b> トレーニング（A×${cntA}・B×${cntB}）｜<span style="color:var(--green)">●</span>=体重記録あり</div>
  </div>`;

  // 選択日の詳細
  const ses = sesByDate[calSel], w = wByDate[calSel];
  html += `<div class="card"><h3>${Number(calSel.split("-")[1])}月${Number(calSel.split("-")[2])}日の記録</h3>`;
  if(!ses && !w){
    html += `<div class="muted small">この日の記録はありません</div>`;
  }else{
    if(ses){
      const cardioParts = [];
      if(ses.cardioMin) cardioParts.push(`${ses.cardioMin}分`);
      if(ses.cardioSpeed) cardioParts.push(`${ses.cardioSpeed}km/h`);
      if(ses.cardioIncline) cardioParts.push(`傾斜${ses.cardioIncline}%`);
      if(ses.cardioLevel) cardioParts.push(`負荷Lv${ses.cardioLevel}`);
      html += `<div class="row" style="margin-bottom:8px"><span class="badge ${ses.menu==="B"?"b":""}">メニュー${ses.menu}</span>
        ${cardioParts.length?`<span class="muted small">有酸素 ${cardioParts.join("・")}</span>`:""}</div>
      <table class="hist">`;
      (ses.exercises||[]).forEach(e=>{
        html += `<tr><td>${esc(e.name)}</td><td style="text-align:right"><b>${e.kg}kg</b></td><td style="width:70px; text-align:right">${e.cleared?'<span style="color:var(--green)">✔ クリア</span>':'<span class="muted">△ 未達</span>'}</td></tr>`;
      });
      html += `</table>`;
    }
    if(w) html += `<div class="small" style="margin-top:8px">⚖️ 体重: <b>${w.kg.toFixed(1)}kg</b>（目標ペース比 ${(w.kg-paceTargetAt(calSel))>0?"+":""}${(w.kg-paceTargetAt(calSel)).toFixed(1)}kg）</div>`;
  }
  html += `</div>`;
  page.innerHTML = html;
}
function calMove(d){
  let m = calYm.m + d, y = calYm.y;
  if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  calYm = {y, m}; renderCal();
}
function calPick(ds){ calSel = ds; renderCal(); }

/* ================= 体重 ================= */
function paceTargetAt(dateStr){
  const st = db.settings;
  const total = dayDiff(st.startDate, st.goalDate);
  const cur = Math.min(Math.max(dayDiff(st.startDate, dateStr),0), total);
  return st.startWeight + (st.goalWeight - st.startWeight) * cur / total;
}
function renderWeight(){
  const page = document.getElementById("page-weight");
  const t = todayStr();
  const st = db.settings;
  const todayW = db.weights.find(w=>w.date===t);
  const latest = db.weights.length ? db.weights[db.weights.length-1] : null;
  const target = paceTargetAt(t);
  let deltaHtml = `<div class="v">-</div>`;
  if(latest){
    const d = latest.kg - paceTargetAt(latest.date);
    deltaHtml = `<div class="v ${d<=0?"good":"bad"}">${d>0?"+":""}${d.toFixed(1)}</div>`;
  }
  let html = `
  <div class="stat-row">
    <div class="stat"><div class="l">最新体重</div><div class="v gold">${latest?latest.kg.toFixed(1):"-"}</div><div class="l">kg${latest?"（"+fmtDate(latest.date)+"）":""}</div></div>
    <div class="stat"><div class="l">今日の目標ペース</div><div class="v">${target.toFixed(1)}</div><div class="l">kg</div></div>
    <div class="stat"><div class="l">ペース比</div>${deltaHtml}<div class="l">kg</div></div>
  </div>
  <div class="card">
    <h3>今日の体重を記録</h3>
    <div class="weight-input-row">
      <input type="text" inputmode="decimal" id="w-input" placeholder="例: 102.4" value="${todayW?todayW.kg:""}">
      <button class="ghost" style="font-weight:700" onclick="saveWeight()">保存</button>
    </div>
    <div class="muted small" style="margin-top:8px">朝トイレ後・same条件で測るとブレが減ります。週平均で0.3〜0.7kg減が目安。</div>
  </div>
  <div class="card">
    <h3>体重推移（実績 vs 目標ペース）</h3>
    ${weightChart()}
    <div class="small" style="margin-top:6px">
      <span style="color:var(--gold)">━ 実績</span>
      <span style="color:var(--blue)">━ 7日平均</span>
      <span style="color:var(--sub)">┅ 目標ペース(${st.startWeight}→${st.goalWeight}kg)</span>
    </div>
  </div>`;
  if(db.weights.length){
    html += `<h2 class="sec">履歴（直近14件）</h2><div class="card"><table class="hist"><tr><th>日付</th><th>体重</th><th>ペース比</th></tr>`;
    db.weights.slice(-14).reverse().forEach(w=>{
      const d = w.kg - paceTargetAt(w.date);
      html += `<tr><td>${fmtDate(w.date)}</td><td>${w.kg.toFixed(1)}kg</td><td style="color:${d<=0?"var(--green)":"var(--red)"}">${d>0?"+":""}${d.toFixed(1)}kg</td></tr>`;
    });
    html += `</table></div>`;
  }
  page.innerHTML = html;
}
function weightChart(){
  const st = db.settings;
  const x = d => dayDiff(st.startDate, d);
  const actual = db.weights.map(w=>({x:x(w.date), y:w.kg}));
  // 7日移動平均
  const ma = [];
  db.weights.forEach((w,i)=>{
    const from = new Date(w.date); from.setDate(from.getDate()-6);
    const fs = from.getFullYear()+"-"+String(from.getMonth()+1).padStart(2,"0")+"-"+String(from.getDate()).padStart(2,"0");
    const win = db.weights.filter(v=>v.date>=fs && v.date<=w.date);
    if(win.length>=3) ma.push({x:x(w.date), y:win.reduce((a,b)=>a+b.kg,0)/win.length});
  });
  const totalDays = dayDiff(st.startDate, st.goalDate);
  const pace = [{x:0,y:st.startWeight},{x:totalDays,y:st.goalWeight}];
  const xTicks = [];
  for(let m=0;m<=3;m++){
    const d = new Date(st.startDate); d.setMonth(d.getMonth()+m);
    const ds = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    xTicks.push({x:x(ds), label:(d.getMonth()+1)+"月"});
  }
  return lineChart([
    {pts:pace, color:"#9a9aa5", width:1.5, dash:"5 5"},
    {pts:ma, color:"#ff4438", width:2},
    {pts:actual, color:"#FFEC00", width:2, dots:true}
  ], {xTicks, yDec:0});
}
function saveWeight(){
  const v = parseFloat(document.getElementById("w-input").value.replace(",", "."));
  if(isNaN(v) || v<30 || v>250){ toast("体重を正しく入力してください"); return; }
  const t = todayStr();
  const idx = db.weights.findIndex(w=>w.date===t);
  if(idx>=0) db.weights[idx].kg = v; else db.weights.push({date:t, kg:v});
  db.weights.sort((a,b)=>a.date<b.date?-1:1);
  save(); toast("⚖️ 体重を記録しました"); renderWeight();
}

/* ================= 推移 ================= */
let progressEx = null;
function renderProgress(){
  const page = document.getElementById("page-progress");
  const allEx = [...db.menus.A, ...db.menus.B].map(e=>e.name);
  if(!progressEx || !allEx.includes(progressEx)) progressEx = allEx[0];
  // 種目の履歴（セッションごとのメイン=最大重量と総レップ）
  const exDef = [...db.menus.A, ...db.menus.B].find(e=>e.name===progressEx);
  const nSets = exDef ? exDef.sets : 3;
  const hist = [];
  db.sessions.forEach(s=>{
    const ex = (s.exercises||[]).find(e=>e.name===progressEx);
    if(ex && Number(ex.kg)>0){
      hist.push({date:s.date, kg:Number(ex.kg), cleared:!!ex.cleared,
                 vol: Number(ex.kg)*10*nSets});
    }
  });
  const st = db.settings;
  const pts = hist.map(h=>({x:dayDiff(st.startDate,h.date), y:h.kg}));
  const first = hist.length?hist[0].kg:null, last = hist.length?hist[hist.length-1].kg:null;
  const growth = (first!=null && first>0) ? ((last-first)/first*100) : null;
  const xTicks = hist.length ? [ {x:pts[0].x, label:fmtDate(hist[0].date)}, {x:pts[pts.length-1].x, label:fmtDate(hist[hist.length-1].date)} ] : [];
  let html = `
  <div class="card">
    <h3>種目を選択</h3>
    <select onchange="progressEx=this.value; renderProgress()">
      ${allEx.map(n=>`<option ${n===progressEx?"selected":""}>${esc(n)}</option>`).join("")}
    </select>
  </div>
  <div class="stat-row">
    <div class="stat"><div class="l">開始重量</div><div class="v">${first!=null?first+"kg":"-"}</div><div class="l">&nbsp;</div></div>
    <div class="stat"><div class="l">現在重量</div><div class="v gold">${last!=null?last+"kg":"-"}</div><div class="l">&nbsp;</div></div>
    <div class="stat"><div class="l">成長率</div><div class="v ${growth>0?"good":""}">${growth!=null?(growth>0?"+":"")+growth.toFixed(0)+"%":"-"}</div><div class="l">&nbsp;</div></div>
  </div>
  <div class="card"><h3>使用重量の推移</h3>${lineChart([{pts, color:"#FFEC00", width:2, dots:true}], {xTicks, yDec:1})}</div>`;
  if(hist.length){
    html += `<h2 class="sec">セッション履歴</h2><div class="card"><table class="hist"><tr><th>日付</th><th>重量</th><th>10回×${nSets}set</th><th>Vol</th></tr>`;
    hist.slice(-12).reverse().forEach(h=>{
      html += `<tr><td>${fmtDate(h.date)}</td><td><b>${h.kg}kg</b></td><td>${h.cleared?'<span style="color:var(--green)">✔ クリア</span>':'<span class="muted">△ 未達</span>'}</td><td>${Math.round(h.vol)}</td></tr>`;
    });
    html += `</table></div><div class="muted small">Vol = 重量×10回×セット数（総負荷量）。これが伸びていれば確実に前進しています。</div>`;
  }
  page.innerHTML = html;
}

      <div><label class="field-label">開始日</label><input type="date" id="st-start" value="${st.startDate}"></div>
      <div><label class="field-label">目標日</label><input type="date" id="st-goal-date" value="${st.goalDate}"></div>
      <div><label class="field-label">開始体重(kg)</label><input type="text" inputmode="decimal" id="st-start-w" value="${st.startWeight}"></div>
      <div><label class="field-label">目標体重(kg)</label><input type="text" inputmode="decimal" id="st-goal-w" value="${st.goalWeight}"></div>
    </div>
    <button class="ghost" onclick="saveSettings()">目標を保存</button>
  </div>`;
  ["A","B"].forEach(m=>{
    html += `<div class="card"><h3>メニュー${m} の編集</h3>
    <div class="menu-edit-head"><span>種目名</span><span>セット</span><span>増量kg</span></div>`;
    db.menus[m].forEach((ex,i)=>{
      html += `<div class="menu-edit-row">
        <input class="nm" id="me-${m}-${i}-name" value="${esc(ex.name)}">
        <input inputmode="numeric" id="me-${m}-${i}-sets" value="${ex.sets}">
        <input inputmode="decimal" id="me-${m}-${i}-inc" value="${ex.inc}">
      </div>`;
    });
    html += `<button class="ghost" style="margin-top:6px" onclick="saveMenus('${m}')">メニュー${m}を保存</button></div>`;
  });
  html += `
  <div class="card">
    <h3>💾 バックアップ</h3>
    <div class="row" style="gap:8px; flex-wrap:wrap">
      <button class="ghost" onclick="exportJson()">📤 エクスポート</button>
      <button class="ghost" onclick="document.getElementById('import-file').click()">📥 インポート</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importJson(this)">
    </div>
    <div class="muted small" style="margin-top:8px">データはこのiPhone内にのみ保存されます。月1回エクスポートしてファイルに保存しておくと安心です。</div>
  </div>
  <div class="card">
    <h3>⚠️ データ削除</h3>
    <button class="danger" onclick="resetAll()">全データを削除して初期化</button>
  </div>
  <div class="muted small" style="text-align:center; padding:8px">Gym Tracker v1.0 ｜ 記録件数: トレ${db.sessions.length}回・体重${db.weights.length}日</div>`;
  page.innerHTML = html;
}
function saveSettings(){
  const st = db.settings;
  st.startDate = document.getElementById("st-start").value || st.startDate;
  st.goalDate = document.getElementById("st-goal-date").value || st.goalDate;
  const sw = parseFloat(document.getElementById("st-start-w").value), gw = parseFloat(document.getElementById("st-goal-w").value);
  if(!isNaN(sw)) st.startWeight = sw;
  if(!isNaN(gw)) st.goalWeight = gw;
  save(); toast("目標を保存しました");
}
function saveMenus(m){
  db.menus[m].forEach((ex,i)=>{
    const g = id => document.getElementById(`me-${m}-${i}-${id}`).value;
    ex.name = g("name") || ex.name;
    const ss=parseInt(g("sets"),10), inc=parseFloat(g("inc"));
    if(!isNaN(ss)) ex.sets=ss; if(!isNaN(inc)) ex.inc=inc;
  });
  save(); toast(`メニュー${m}を保存しました`); renderSettings();
}
function exportJson(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `gym-tracker-backup-${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("エクスポートしました");
}
function importJson(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d.menus || !d.settings) throw new Error("形式が違います");
      db = d; save(); toast("インポートしました");
      curMenu=null; renderAll();
    }catch(e){ toast("読込失敗: JSONが不正です"); }
  };
  r.readAsText(f);
  input.value = "";
}
function resetAll(){
  if(!confirm("本当に全データを削除しますか？（トレ記録・体重記録がすべて消えます）")) return;
  if(!confirm("最終確認：エクスポート済みですか？削除は取り消せません。")) return;
  db = JSON.parse(JSON.stringify(SEED)); save();
  curMenu=null; renderAll(); toast("初期化しました");
}

/* ================= タブ・初期化 ================= */
const renders = {today:renderToday, cal:renderCal, weight:renderWeight, progress:renderProgress, settings:renderSettings};
document.querySelectorAll("nav button").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    document.querySelectorAll(".tab-page").forEach(p=>p.classList.remove("active"));
    document.getElementById("page-"+b.dataset.tab).classList.add("active");
    renders[b.dataset.tab]();
    window.scrollTo(0,0);
  });
});
function renderAll(){ renderToday(); renderCal(); renderWeight(); renderProgress(); renderSettings(); }
document.getElementById("hdr-date").textContent =
  new Date().toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"});
renderToday();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
